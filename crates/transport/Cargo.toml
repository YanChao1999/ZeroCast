[package]
name = "zerocast_transport"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "zerocast_transport"
path = "src/lib.rs"

[dependencies]
zerocast_core = { path = "../core" }
zerocast_platform = { path = "../platform" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
anyhow = "1.0"
bytes = "1"
minifb = "0.28"
rtp = "0.2"
webrtc-util = "0.2"
ffmpeg-next = { version = "4.4", optional = true }

[dev-dependencies]
serial_test = "3"

[features]
libav = ["ffmpeg-next"]
