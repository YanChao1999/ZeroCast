name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (X11 for scrap/minifb, ffmpeg, libopus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libx11-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev
      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1
      - name: Unit tests (workspace, lib only)
        run: cargo test --workspace --lib
      - name: Opus encoder smoke (native opus-rs)
        run: cargo test -p zerocast_audio encode_sine_frame native::tests::native_sine_roundtrip -- --nocapture
      - name: FFmpeg integration (426p + 720p roundtrip)
        run: cargo test -p zerocast_transport --test ffmpeg_integration
      - name: QoS controller tests
        run: "cargo test -p zerocast_core qos::"

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: ffmpeg
      - name: Verify ffmpeg
        run: ffmpeg -version
        shell: bash
      - name: Unit tests (workspace, lib only)
        run: cargo test --workspace --lib
      - name: FFmpeg integration
        run: cargo test -p zerocast_transport --test ffmpeg_integration
      - name: QoS controller tests
        run: "cargo test -p zerocast_core qos::"

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Verify ffmpeg
        run: ffmpeg -version | head -n 1
      - name: Unit tests (workspace, lib only)
        run: cargo test --workspace --lib
      - name: FFmpeg integration
        run: cargo test -p zerocast_transport --test ffmpeg_integration
      - name: QoS controller tests
        run: "cargo test -p zerocast_core qos::"

  # Mobile apps are not in-tree yet; keep core + platform (stub capture) compiling on device targets.
  check-ios:
    name: check (ios)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Add iOS simulator target
        run: rustup target add aarch64-apple-ios-sim
      - name: cargo check (core, platform)
        run: cargo check -p zerocast_core -p zerocast_platform --target aarch64-apple-ios-sim

  coverage-linux:
    name: coverage (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install system deps (X11 for scrap/minifb, ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libx11-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev
      - name: Collect LLVM coverage (line + branch)
        run: |
          cargo llvm-cov test --workspace --lib --no-report
          cargo llvm-cov test -p zerocast_transport --test ffmpeg_integration --no-report
          cargo llvm-cov report --branch --summary-only
          cargo llvm-cov report --branch --lcov --output-path lcov.info
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  check-android:
    name: check (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
      - name: Add Android target
        run: rustup target add aarch64-linux-android
      - name: Configure Android linker
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          EOF
      - name: cargo check (core, platform)
        run: cargo check -p zerocast_core -p zerocast_platform --target aarch64-linux-android

  check-aarch64-linux:
    name: check (aarch64 linux recv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Add aarch64 Linux target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: cargo check (desktop recv binary)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo check -p zerocast_desktop --target aarch64-unknown-linux-gnu --no-default-features
